name: Wrong lock verdict
description: A rule flagged a safe migration, or missed a dangerous one.
labels: ["area: rules", "status: needs triage"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong
      options:
        - False positive (flagged, but it's safe)
        - False negative (passed, but it locked)
    validations:
      required: true
  - type: textarea
    id: sql
    attributes:
      label: The migration
      render: sql
    validations:
      required: true
  - type: input
    id: pg
    attributes:
      label: Postgres version
      placeholder: "16"
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Approximate table size
      placeholder: "40M rows, 12 GB"
  - type: textarea
    id: evidence
    attributes:
      label: What you observed
      description: Lock waits, blocked queries, timings, or why you believe the verdict is wrong.
